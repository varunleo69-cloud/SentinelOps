
name: SentinelOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sentinelops:latest .

      - name: Start test container
        run: |
          docker run -d \
            --name sentinel-test \
            -p 5000:5000 \
            sentinelops:latest

      - name: Wait for application startup
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/health; then
              echo "Application started successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          docker logs sentinel-test
          exit 1

      - name: Test homepage
        run: |
          curl -f http://localhost:5000/
          echo "Homepage test passed"

      - name: Test application health
        run: |
          curl -f http://localhost:5000/health
          echo "Health test passed"

      - name: Test Prometheus metrics
        run: |
          curl -fsS http://localhost:5000/metrics | grep "sentinel_http_requests_total"
          echo "Metrics test passed"

      - name: Cleanup
        if: always()
        run: docker rm -f sentinel-test || true
