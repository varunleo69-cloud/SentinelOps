name: SentinelOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sentinelops:latest .

      - name: Start test container
        run: |
          docker run -d \
            --name sentinel-test \
            -p 5000:5000 \
            sentinelops:latest

      - name: Test application
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f sentinel-test || true
